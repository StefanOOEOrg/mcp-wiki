[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-wiki"
version = "0.1.0"
description = "Local RAG document store over a folder of markdown, as an MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "StefanOOE" }]
keywords = ["mcp", "model-context-protocol", "rag", "sqlite", "sqlite-vec", "embeddings"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = ["mcp>=2.0", "sqlite-vec>=0.1.6", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
mcp-wiki = "mcp_wiki.cli:main"

[project.urls]
Homepage = "https://github.com/StefanOOE/mcp-wiki"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_wiki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
